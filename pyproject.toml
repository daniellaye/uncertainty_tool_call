[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-tool-call"
version = "0.1.0"
description = "Uncertainty quantification for LLM function-calling (TMLR)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zihuiwen Ye" }]

# Enough to recompute the uncertainty estimators and build Table 1.
# Deliberately no torch / transformers / vllm: the estimators used here cluster
# function calls by exact match and by AST, so no neural entailment model is
# needed.
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Only for `utoolcall prepare` and the nested BFCL harness, i.e. producing
# combined files from scratch. Needs a GPU.
generate = [
    "torch>=2.0",
    "transformers>=4.55.2,<5.0",
    "accelerate>=1.0",
    "huggingface_hub",
    "typer>=0.12",
    "tabulate>=0.9",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0",
    "overrides",
    "tqdm",
    # BFCL imports every model handler at startup, so the API clients are needed
    # even for local models. Versions as in the environment the paper used.
    "requests",
    "openai",
    "anthropic==0.39.0",
    "mistralai==1.1.0",
    "cohere==5.13.3",
    "google-cloud-aiplatform==1.72.0",
    "writer-sdk>=1.2.0",
    "boto3",
    "tenacity==9.0.0",
    "tree_sitter==0.21.3",
    "tree-sitter-java==0.21.0",
    "tree-sitter-javascript==0.21.4",
    "datamodel-code-generator==0.25.7",
    "mpmath==1.3.0",
]
# The version the paper's generations were produced with.
vllm = ["vllm==0.11.0"]

[project.scripts]
utoolcall = "uncertainty_tool_call.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uncertainty_tool_call*"]

[tool.setuptools.package-data]
"uncertainty_tool_call.bfcl" = [
    "data/**/*.json",
    "data/**/*.jsonl",
    "utils_data/**/*.json",
    "test_case_ids_to_generate.json",
]
